<body>

<div class="container">
    <header>
        <h1>Awesome Cybersecurity Datasets</h1>
        <p>A curated, actively maintained list of amazingly awesome cybersecurity datasets.</p>
        <div class="badges">
            <span class="badge verified"><i class="fa-solid fa-check-circle"></i> 100% Validated Links</span>
            <span class="badge"><i class="fa-solid fa-calendar"></i> Updated 2026</span>
            <span class="badge"><i class="fa-brands fa-github"></i> SystemHelpdesk</span>
        </div>
        <a href="https://github.com/jordanricky1604-ship-it/Awesome-Cybersecurity-Datasets/issues/new?assignees=&labels=dataset-submission&projects=&template=new-dataset.yml" class="submit-btn" target="_blank">
            <i class="fa-solid fa-plus"></i> Submit a Dataset
        </a>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search datasets by name or description...">
        <div class="category-filters" id="categoryFilters">
            <button class="filter-btn active" data-category="all">All Categories</button>
            <!-- Categories injected here -->
        </div>
    </div>

    <div class="dataset-grid" id="datasetGrid">
        <!-- Dataset cards injected here -->
    </div>
</div>

<script>
    let allDatasets = [];
    let activeCategory = 'all';

    fetch('datasets.json')
        .then(response => response.json())
        .then(data => {
            allDatasets = data;
            
            // We want to force 'State of the Art (2026)' to the front, then alphabetical
            allDatasets.sort((a, b) => {
                if (a.category === 'State of the Art (2026)') return -1;
                if (b.category === 'State of the Art (2026)') return 1;
                return a.name.localeCompare(b.name);
            });
            
            populateCategories();
            renderDatasets(allDatasets);
        })
        .catch(error => {
            console.error('Error loading datasets:', error);
            document.getElementById('datasetGrid').innerHTML = '<div class="no-results">Failed to load datasets.</div>';
        });

    function populateCategories() {
        const categories = [...new Set(allDatasets.map(d => d.category))].sort();
        const filterContainer = document.getElementById('categoryFilters');
        
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.setAttribute('data-category', cat);
            btn.innerText = cat;
            btn.onclick = () => setCategory(cat);
            filterContainer.appendChild(btn);
        });
        
        // Reset "All" button click
        filterContainer.querySelector('[data-category="all"]').onclick = () => setCategory('all');
    }

    function setCategory(cat) {
        activeCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.filter-btn[data-category="${cat}"]`).classList.add('active');
        filterData();
    }

    document.getElementById('searchInput').addEventListener('input', filterData);

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = allDatasets.filter(d => {
            const matchesCategory = activeCategory === 'all' || d.category === activeCategory;
            const matchesSearch = d.name.toLowerCase().includes(query) || d.description.toLowerCase().includes(query);
            return matchesCategory && matchesSearch;
        });
        
        renderDatasets(filtered);
    }

    function renderDatasets(datasets) {
        const grid = document.getElementById('datasetGrid');
        grid.innerHTML = '';
        
        if (datasets.length === 0) {
            grid.innerHTML = '<div class="no-results">No datasets found matching your criteria.</div>';
            return;
        }
        
        datasets.forEach(d => {
            const card = document.createElement('div');
            card.className = 'dataset-card';
            
            card.innerHTML = `
                <div class="dataset-category">${d.category}</div>
                <a href="${d.url}" class="dataset-title" target="_blank" rel="noopener noreferrer">${d.name}</a>
                <div class="dataset-desc">${d.description}</div>
            `;
            grid.appendChild(card);
        });
    }
</script>

</body>
